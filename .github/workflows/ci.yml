name: ci

# Pull requests and pushes to main. This stays on the diff: typecheck, lint, and
# unit coverage when code changes, plus host or browser integration when the diff
# can reach those hosts. Mutation, real-weight model tests, and evals are release
# gates in promote.yml, not part of a small change.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # onnxruntime-node (via transformers.js) otherwise downloads CUDA libraries at install.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      browser: ${{ steps.filter.outputs.browser }}
      host: ${{ steps.filter.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node tools/ci/github.mjs pull

  check:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - if: needs.scope.outputs.code == 'true'
        run: npm run typecheck
      - if: needs.scope.outputs.code == 'true'
        run: npm run test:unit -- --coverage

  # Chromium for the browser host and the playground. pnpm for the ACP harness
  # adapter, which installs its bridge into each sandbox. Docker is on the runner.
  integration:
    needs: scope
    if: needs.scope.outputs.browser == 'true' || needs.scope.outputs.host == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: needs.scope.outputs.browser == 'true'
        run: npx playwright-core install --with-deps chromium
      - if: needs.scope.outputs.host == 'true'
        run: npm install -g pnpm@10.33.0
      - env:
          BROWSER: ${{ needs.scope.outputs.browser }}
          HOST: ${{ needs.scope.outputs.host }}
        run: |
          node tools/ci/github.mjs integration > /tmp/integration-files.txt
          test -s /tmp/integration-files.txt
          xargs npx vitest run < /tmp/integration-files.txt
